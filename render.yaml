services:
  - type: web
    name: chore-app-backend
    runtime: node
    rootDir: chore-app/backend
    buildCommand: npm install && npm run build
    startCommand: npm start
    envVars:
      - key: DATABASE_URL
        sync: false   # set manually in Render dashboard
      - key: PORT
        value: 3000
      - key: CORS_ORIGIN
        sync: false   # set to your Vercel frontend URL, e.g. https://your-app.vercel.app
